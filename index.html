<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Australia's Black Summer — Fire, Forest &amp; Wildlife</title>

  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Title bar -->
  <header class="title-bar">
    <h1>Australia's <span>Black Summer</span> — Fire, Forest &amp; Wildlife</h1>
  </header>

  <div class="page-wrapper">

    <!-- 01 Where Did It Burn -->
    <section class="section">
      <h2 class="section-title">01 — Where Did It Burn?</h2>
      <div class="card full-width">
        <div id="choropleth_map"></div>
      </div>
    </section>

    <hr class="divider" />

    <!-- 02 Five Seasons in Context -->
    <section class="section">
      <h2 class="section-title">02 — Five Seasons in Context</h2>
      <div class="grid-2">
        <div class="card"><div id="annual_annotation"></div></div>
        <div class="card"><div id="annual_trend"></div></div>
      </div>
    </section>

    <hr class="divider" />

    <!-- 03 Planned vs Unplanned -->
    <section class="section">
      <h2 class="section-title">03 — Planned vs. Unplanned Burning</h2>
      <div class="card full-width">
        <div id="planned_proportion"></div>
      </div>
    </section>

    <hr class="divider" />

    <!-- 04 State by State -->
    <section class="section">
      <h2 class="section-title">04 — State by State</h2>
      <div class="grid-2">
        <div class="card"><div id="state_fire_bar"></div></div>
        <div class="card"><div id="bump_chart"></div></div>
      </div>
      <div class="card full-width mt">
        <div id="heatmap"></div>
      </div>
    </section>

    <hr class="divider" />

    <!-- 05 What Burned -->
    <section class="section">
      <h2 class="section-title">05 — What Burned?</h2>
      <div class="grid-2">
        <div class="card"><div id="forest_category"></div></div>
        <div class="card"><div id="connected_dot"></div></div>
      </div>
    </section>

    <hr class="divider" />

    <!-- 06 Ecological Toll -->
    <section class="section">
      <h2 class="section-title">06 — Ecological Toll</h2>
      <div class="grid-narrow-wide">
        <div class="card" style="display:flex;align-items:center;justify-content:center;">
          <div id="species_donut"></div>
        </div>
        <div class="card"><div id="species_bar"></div></div>
      </div>
      <div class="card full-width mt">
        <div id="species_bubble"></div>
      </div>
    </section>

  </div><!-- /page-wrapper -->

  <script src="js/vega_vis.js"></script>
</body>
</html>
